openapi: 3.1.0
info:
  title: Freewind Debug Bridge HTTP API
  version: 0.1.0
  description: |
    Android / Swift debug bridge 统一协议。
    `GET /` 不属于协议；web console 已外置到独立项目。
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8765"
paths:
  /meta:
    get:
      operationId: getMeta
      responses:
        "200":
          description: App metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
  /help:
    get:
      operationId: getHelp
      responses:
        "200":
          description: Dynamic help summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpResponse"
  /action:
    get:
      operationId: getActionCatalog
      parameters:
        - $ref: "#/components/parameters/targetId"
        - name: action
          in: query
          schema:
            type: string
        - name: screen
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Action catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionCatalogResponse"
    post:
      operationId: postAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Accepted or handled action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: Rejected action or bad payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "500":
          description: Route-level error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /logs:
    get:
      operationId: getLogs
      parameters:
        - name: event
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/targetId"
        - name: screen
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Log summary or filtered items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
    delete:
      operationId: clearLogs
      responses:
        "200":
          description: Clear result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsClearResponse"
  /state:
    get:
      operationId: getState
      parameters:
        - name: keys
          in: query
          schema:
            type: string
            description: Comma-separated keys
        - $ref: "#/components/parameters/targetId"
        - name: scope
          in: query
          schema:
            type: string
            enum: [app, target, branch]
      responses:
        "200":
          description: State summary or scoped payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
  /snapshot:
    get:
      operationId: getSnapshot
      parameters:
        - $ref: "#/components/parameters/targetId"
        - name: scope
          in: query
          schema:
            type: string
            enum: [self, branchToRoot, subtree]
        - name: depth
          in: query
          schema:
            type: integer
        - name: types
          in: query
          schema:
            type: string
            description: Comma-separated types
        - name: textKeyword
          in: query
          schema:
            type: string
        - name: visible
          in: query
          schema:
            type: boolean
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: clickable
          in: query
          schema:
            type: boolean
        - name: fields
          in: query
          schema:
            type: string
            description: Comma-separated field names
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Snapshot summary or node list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
components:
  parameters:
    targetId:
      name: targetId
      in: query
      schema:
        type: string
  schemas:
    MetaResponse:
      type: object
      required: [appName, buildVersion]
      properties:
        appName:
          type: string
        buildVersion:
          type: number
    HelpResponse:
      type: object
      required: [appName, screenName, serverTime, capabilities, counts, endpoints, examples]
      properties:
        appName:
          type: string
        consoleTitle:
          type: string
        screenName:
          type: string
        serverTime:
          type: string
        capabilities:
          type: array
          items:
            type: string
        counts:
          type: object
          required: [actionTargetCount, logCount, stateKeyCount, snapshotNodeCount]
          properties:
            actionTargetCount:
              type: integer
            logCount:
              type: integer
            stateKeyCount:
              type: integer
            snapshotNodeCount:
              type: integer
        endpoints:
          type: array
          items:
            type: object
            required: [method, path, summary]
            properties:
              method:
                type: string
              path:
                type: string
              summary:
                type: string
              queryFields:
                type: array
                items:
                  type: string
              bodyFields:
                type: array
                items:
                  type: string
        examples:
          type: array
          items:
            type: string
    ActionRequest:
      type: object
      required: [action, targetId]
      properties:
        action:
          type: string
        targetId:
          type: string
        text:
          type: string
        dx:
          type: number
        dy:
          type: number
        args:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
    ActionResponse:
      type: object
      required: [accepted, message]
      properties:
        accepted:
          type: boolean
        ok:
          type: boolean
        message:
          type: string
        action:
          type: string
        targetId:
          type: string
        errorType:
          type: string
        timedOut:
          type: boolean
        durationMs:
          type: integer
    ActionCatalogResponse:
      type: object
      required: [summary, items]
      properties:
        summary:
          type: object
          required: [targetCount, actionCount]
          properties:
            targetCount:
              type: integer
            actionCount:
              type: integer
        items:
          type: array
          items:
            type: object
            required: [targetId, actions]
            properties:
              targetId:
                type: string
              targetType:
                type: string
              screen:
                type: string
              actions:
                type: array
                items:
                  type: object
                  required: [name, args, example]
                  properties:
                    name:
                      type: string
                    args:
                      type: array
                      items:
                        type: string
                    summary:
                      type: string
                    example:
                      $ref: "#/components/schemas/ActionRequest"
    LogsResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
            timeRange:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
            levelCounts:
              type: object
              additionalProperties:
                type: integer
            sourceCounts:
              type: object
              additionalProperties:
                type: integer
            eventCountsTop:
              type: object
              additionalProperties:
                type: integer
        items:
          type: array
          items:
            type: object
            required: [seq, time, source, level, event, data]
            properties:
              seq:
                type: integer
              time:
                type: string
              source:
                type: string
              level:
                type: string
              event:
                type: string
              targetId:
                type: string
              summary:
                type: string
              data:
                type: object
                additionalProperties:
                  type: string
        nextAfterSeq:
          type: integer
    LogsClearResponse:
      type: object
      required: [accepted, message, clearedCount]
      properties:
        accepted:
          type: boolean
        message:
          type: string
        clearedCount:
          type: integer
        ok:
          type: boolean
        deletedCount:
          type: integer
    StateResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            appStateKeys:
              type: array
              items:
                type: object
                required: [key, sample]
                properties:
                  key:
                    type: string
                  sample:
                    type: string
            targetStateTargets:
              type: array
              items:
                type: string
        appState:
          type: object
          additionalProperties:
            type: string
        targetState:
          type: object
          additionalProperties:
            type: string
    SnapshotResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            screen:
              type: string
            nodeCount:
              type: integer
            rootIds:
              type: array
              items:
                type: string
            typeCounts:
              type: object
              additionalProperties:
                type: integer
            clickableCount:
              type: integer
        fieldCatalog:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        screen:
          type: string
        nodes:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              parentId:
                type: string
              type:
                type: string
              text:
                type: string
              role:
                type: string
              backgroundColor:
                type: string
              contentColor:
                type: string
              visible:
                type: boolean
              enabled:
                type: boolean
              clickable:
                type: boolean
              value:
                type: string
              extra:
                type: object
                additionalProperties:
                  type: string
              bounds:
                type: object
                properties:
                  left:
                    type: number
                  top:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
